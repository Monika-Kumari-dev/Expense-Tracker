<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
          <div><h1 class="h2 mb-1">Expense Tracker</h1><p class="text-secondary mb-0">Track your spending, stored on this device.</p></div>
          <span class="badge text-bg-primary fs-6">JavaScript + Bootstrap</span>
        </div>
        <div class="card border-0 shadow-sm mb-4"><div class="card-body p-4">
          <p class="text-secondary mb-1">Total Expenses</p><h2 class="display-6 fw-bold mb-0" id="total">₹0.00</h2>
        </div></div>
        <div class="card border-0 shadow-sm mb-4"><div class="card-body p-4">
          <h2 class="h5 mb-3" id="formTitle">Add Expense</h2>
          <form id="expenseForm" class="row g-3">
            <div class="col-md-6"><label for="description" class="form-label">Description</label><input id="description" class="form-control" type="text" placeholder="e.g. Groceries" maxlength="100" required></div>
            <div class="col-md-3"><label for="amount" class="form-label">Amount (₹)</label><input id="amount" class="form-control" type="number" min="0.01" step="0.01" placeholder="250" required></div>
            <div class="col-md-3"><label for="category" class="form-label">Category</label><select id="category" class="form-select" required><option value="Food">Food</option><option value="Transport">Transport</option><option value="Shopping">Shopping</option><option value="Bills">Bills</option><option value="Other">Other</option></select></div>
            <div class="col-md-4"><label for="date" class="form-label">Date</label><input id="date" class="form-control" type="date" required></div>
            <div class="col-12 d-flex gap-2"><button class="btn btn-primary" id="saveButton" type="submit">Add Expense</button><button class="btn btn-outline-secondary d-none" id="cancelButton" type="button">Cancel Edit</button></div>
          </form>
          <div id="message" class="mt-3" role="status" aria-live="polite"></div>
        </div></div>
        <div class="card border-0 shadow-sm"><div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3"><h2 class="h5 mb-0">Expense History</h2><button type="button" id="clearButton" class="btn btn-sm btn-outline-danger">Clear All</button></div>
          <div class="table-responsive"><table class="table table-hover align-middle"><thead class="table-light"><tr><th>Date</th><th>Description</th><th>Category</th><th class="text-end">Amount</th><th class="text-end">Actions</th></tr></thead><tbody id="expenseList"></tbody></table></div>
          <p id="emptyState" class="text-center text-secondary py-3 mb-0">No expenses yet. Add your first expense above.</p>
        </div></div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
